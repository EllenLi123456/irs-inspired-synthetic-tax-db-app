<!DOCTYPE html>
<html>

<head>
    <title>Edit Tax Return</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- Main navigation -->
    <nav class="top-nav">

        <div class="app-title">
            IRS Database Application
        </div>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/taxpayers">Taxpayers</a>
            <a href="/taxreturns">Tax Returns</a>

            <span class="nav-wip">Income (WIP)</span>
            <span class="nav-wip">Deductions (WIP)</span>
            <span class="nav-wip">Credits (WIP)</span>
            <span class="nav-wip">Refunds (WIP)</span>
            <span class="nav-wip">Balance Due (WIP)</span>
            <span class="nav-wip">Forms (WIP)</span>

            <a href="/analytics">Analytics</a>
        </div>

    </nav>


    <div class="page-container">

        <h1>Edit Tax Return</h1>

        {% if error_message %}
            <p class="error-message">
                {{ error_message }}
            </p>
        {% endif %}

        <form method="POST">

            <label>Return ID:</label><br>
            <input type="number"
                   value="{{ taxreturn.ReturnID }}"
                   readonly>

            <br><br>


            <label>Taxpayer:</label><br>

            <select name="taxpayer_id" required>

                {% for taxpayer in taxpayers %}

                    <option value="{{ taxpayer.TaxpayerID }}"
                        {% if taxpayer.TaxpayerID == taxreturn.TaxpayerID %}
                            selected
                        {% endif %}>

                        {{ taxpayer.TaxpayerID }}
                        -
                        {{ taxpayer.FirstName }}
                        {{ taxpayer.LastName }}

                    </option>

                {% endfor %}

            </select>

            <br><br>


            <label>Tax Year:</label><br>

                <select
                    name="tax_year"
                    {% if tax_year_error %}style="border: 2px solid red;"{% endif %}
                    required
                >

                    <option value="">Select Tax Year</option>

                    <option value="2023"
                        {% if taxreturn.TaxYear|string == "2023" %}selected{% endif %}>
                        2023
                    </option>

                    <option value="2024"
                        {% if taxreturn.TaxYear|string == "2024" %}selected{% endif %}>
                        2024
                    </option>

                    <option value="2025"
                        {% if taxreturn.TaxYear|string == "2025" %}selected{% endif %}>
                        2025
                    </option>

                    <option value="2026"
                        {% if taxreturn.TaxYear|string == "2026" %}selected{% endif %}>
                        2026
                    </option>

                </select>
            <br><br>


            <label>Filing Status:</label><br>

            <select name="filing_status" required>

                <option value="Single"
                    {% if taxreturn.FilingStatus == "Single" %}selected{% endif %}>
                    Single
                </option>

                <option value="MFJ"
                    {% if taxreturn.FilingStatus == "MFJ" %}selected{% endif %}>
                    Married Filing Jointly (MFJ)
                </option>

                <option value="MFS"
                    {% if taxreturn.FilingStatus == "MFS" %}selected{% endif %}>
                    Married Filing Separately (MFS)
                </option>

                <option value="HOH"
                    {% if taxreturn.FilingStatus == "HOH" %}selected{% endif %}>
                    Head of Household (HOH)
                </option>

                <option value="QSS"
                    {% if taxreturn.FilingStatus == "QSS" %}selected{% endif %}>
                    Qualifying Surviving Spouse (QSS)
                </option>

            </select>

            <br><br>


            <label>Filing Date:</label><br>
            <input type="date"
                   name="filing_date"
                   value="{{ taxreturn.FilingDate }}"
                   required>

            <br><br>


            <label>Total Income:</label><br>
            <input type="number"
                   step="0.01"
                   min="0"
                   name="total_income"
                   value="{{ taxreturn.TotalIncome }}"
                   required>

            <br><br>


            <label>Adjusted Gross Income:</label><br>
            <input type="number"
                   step="0.01"
                   min="0"
                   name="adjusted_gross_income"
                   value="{{ taxreturn.AdjustedGrossIncome }}"
                   required>

            <br><br>


            <label>Total Deductions:</label><br>
            <input type="number"
                   step="0.01"
                   min="0"
                   name="total_deductions"
                   value="{{ taxreturn.TotalDeductions }}"
                   required>

            <br><br>


            <label>Taxable Income:</label><br>
            <input type="number"
                   step="0.01"
                   min="0"
                   name="taxable_income"
                   value="{{ taxreturn.TaxableIncome }}"
                   required>

            <br><br>


            <label>Total Nonrefundable Credits:</label><br>
            <input type="number"
                   step="0.01"
                   min="0"
                   name="total_nonrefundable_credits"
                   value="{{ taxreturn.TotalNonrefundableCredits }}"
                   required>

            <br><br>


            <label>Total Tax:</label><br>
            <input type="number"
                   step="0.01"
                   min="0"
                   name="total_tax"
                   value="{{ taxreturn.TotalTax }}"
                   required>

            <br><br>


            <button class="edit-button" type="submit">
                Save Changes
            </button>

            <a href="/taxreturns">
                <button type="button">
                    Cancel
                </button>
            </a>

        </form>

    </div>

</body>

</html>
